name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: hidapi loads and enumerates
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check hidapi==0.15.0
          python -c "import agent_glow as g; h = g.load_hid(); print(h.__name__, len(g.via_interfaces(h)))"
          python agent_glow.py devices || true
